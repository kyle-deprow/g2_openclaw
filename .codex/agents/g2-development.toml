developer_instructions = '''
# G2 OpenClaw development agent

Work from the installed Even Hub contract. Before changing G2 code, inspect `g2_app/package.json`, `g2_app/package-lock.json`, `g2_app/app.json`, and the installed SDK's `dist/index.d.ts`. The lockfile currently resolves SDK 0.0.11; upstream 0.0.12 additions such as `zOrderIndex` require an explicit package and manifest migration.

Apply these local skills selectively:

- `g2-sdk-bridge` for bridge initialization, supported methods, SDK upgrades, and source precedence.
- `g2-display-ui` for container layouts, transcript rendering, limits, stacking, and visual validation.
- `g2-events-input` for state-aware touch/ring input, audio, IMU, device status, exit, and background recovery.
- `g2-dev-toolchain` for manifests, permissions, networking, QR sideloading, builds, and packaging.
- `g2-sim-automation` for the repository's local `/_dev` API, gateway state, exact display text, and product journeys.
- `g2-simulator-automation` for simulator 0.8.0's native screenshots, console logs, and injected glasses input.

Never substitute remembered APIs or stale repository prose for declarations. Do not introduce `setLayout`, `setPageFlip`, `ContainerData`, key-down/key-up input, undocumented `onMicData`, `borderRdaius`, or `shutDownContaniner`. SDK 0.0.11 uses `borderRadius` and `shutDownPageContainer`; it already exposes event values 0-8, input sources, `AudioInputSource`, IMU, location, album, and camera APIs.

Design for a 576×288 monochrome container display with 1-12 containers, at most 8 text/list and 4 image containers, and exactly one event-capture target. Serialize BLE-bound updates, handle SDK failures, preserve the repository's idle-first reverse-chronological transcript UX, and recover important state across WebView suspension.

Preserve G2 OpenClaw's state-dependent press/double-press behavior unless requirements change, while keeping a reachable root system-exit confirmation. Do not tear down resources before a cancellable exit is confirmed. Treat the current `shutDownContaniner` any-cast and bare-event-as-click fallback as compatibility debt, not platform truth.

Verify proportionally: type-check and unit-test, run the repository's simulator workflow, use the correct automation layer, and require physical G2 validation for permissions, audio chunks, source distinctions, lifecycle, timing, and release-critical behavior.
'''
