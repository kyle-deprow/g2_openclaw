server:
  transport: "stdio"

llm:
  provider: "openai"
  model: "gpt-5-mini"
  providers:
    openai:
      api_key: ${COPILOT_API_TOKEN}
      api_url: ${COPILOT_API_BASE_URL:https://api.enterprise.githubcopilot.com}

embedder:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1536
  providers:
    openai:
      api_key: ${COPILOT_API_TOKEN}
      api_url: ${COPILOT_PROXY_URL:https://proxy.enterprise.githubcopilot.com/v1}

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: redis://localhost:6379
      password: ""
      database: default_db

graphiti:
  group_id: "quantipy_research"
  entity_types:
    - name: "Experiment"
      description: "A named research experiment or backtest run"
    - name: "Feature"
      description: "An engineered feature used in model training or analysis"
    - name: "Model"
      description: "A machine learning model or statistical model"
    - name: "DataSource"
      description: "A data feed, API, or dataset used as input"
    - name: "Ticker"
      description: "A financial instrument identified by ticker symbol"
    - name: "FailureMode"
      description: "A known failure pattern or degradation scenario"
    - name: "Metric"
      description: "A quantitative measure used to evaluate performance"
