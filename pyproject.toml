[project]
name = "g2-openclaw"
version = "0.1.0"
description = "G2 glasses to OpenClaw gateway with autonomous Quantipy research orchestration"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "azure-identity>=1.17",
    "azure-mgmt-resource>=23.0",
    "websockets>=16.0",
    "python-dotenv>=1.2.1",
    "numpy>=1.26",
    "sounddevice>=0.5.5",
    "faster-whisper>=1.0",
    "pyyaml>=6.0",
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-logging>=0.62b0",
    "opentelemetry-semantic-conventions>=0.62b0",
]
dev = [
    "g2-openclaw[otel]",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
azure-infra-cli = "infra.main:app"
gateway-cli = "gateway.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra", "gateway"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["gateway", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "."

[[tool.mypy.overrides]]
module = "faster_whisper.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["gateway"]
asyncio_mode = "auto"

